name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      # Setup needs package downloads; checks run without network, including
      # their subprocesses. Neither check uses repository or research secrets.
      - name: Run offline tests
        run: sudo unshare --net -- "$(command -v python)" -m pytest
      - name: Check configuration offline
        run: sudo unshare --net -- "$(command -v theme-contagion)" check-config
